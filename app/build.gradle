plugins {
    id 'com.android.application'
}

android {
    namespace = 'cloud.einknote.einknote'
    compileSdk = 34

    defaultConfig {
        applicationId = "cloud.einknote.einknote"
        minSdk = 28  // 안드로이드9
        targetSdk = 34
        versionCode = 19  // 구글 가능!! 이잉크 단말기에 맞게 Thread.Sleep()
        versionName = "3.0"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    // ---------------- [여기 블록 추가] ----------------
    lint {
        checkReleaseBuilds false    // 릴리즈 빌드 시 린트 검사로 인한 빌드 중단 방지
        abortOnError false          // 사소한 린트 경고가 있어도 빌드 강제 속행
    }
    // --------------------------------------------------

    buildFeatures {
        viewBinding = true
        dataBinding = false
    }

    // 1. 도장 위치와 비밀번호를 적어줍니다 (위치는 실제 파일 경로로 수정)
    signingConfigs {
        release {
            storeFile file("<키경로>") // 키스토어 경로
            storePassword '비번'
            keyAlias '키'
            keyPassword '비번'
        }
    }

    buildTypes {
        release {
            // 2. 릴리즈 빌드할 때 위에서 세팅한 'release' 도장을 찍으라고 명령합니다.
            signingConfig signingConfigs.release

            // 주의: 코드를 압축/난독화하는 기능입니다.
            // 구글 API와 충돌할 수 있으므로 일단 false로 두고 출시하는 것을 권장합니다.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    packaging {
        resources {
            excludes += [
                    'META-INF/DEPENDENCIES',
                    'META-INF/LICENSE',
                    'META-INF/LICENSE.txt',
                    'META-INF/license.txt',
                    'META-INF/NOTICE',
                    'META-INF/NOTICE.txt',
                    'META-INF/notice.txt',
                    'META-INF/ASL2.0',
                    'META-INF/*.kotlin_module'
            ]
            pickFirsts += [
                    'META-INF/INDEX.LIST',
                    'META-INF/io.netty.versions.properties'
            ]
        }
    }
}


dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Google Sign-In
    implementation 'com.google.android.gms:play-services-auth:21.0.0'

    // 1. Google API Client (최신 2.2.0)
    implementation('com.google.api-client:google-api-client-android:2.2.0') {
        exclude group: 'org.apache.httpcomponents'
        exclude group: 'com.google.guava', module: 'listenablefuture'
    }
    implementation 'com.google.api-client:google-api-client-gson:2.2.0'

    // 2. Google Docs & Drive API (최신 2.0.0)
    implementation ('com.google.apis:google-api-services-docs:v1-rev20240730-2.0.0'){
        exclude group: 'org.apache.httpcomponents'
        exclude group: 'com.google.guava', module: 'listenablefuture'
    }
    implementation('com.google.apis:google-api-services-drive:v3-rev20240521-2.0.0') {
        exclude group: 'org.apache.httpcomponents'
        exclude group: 'com.google.guava', module: 'listenablefuture'
    }

    // 3. 최신 구글 인증 라이브러리 (GoogleAccountCredential 대체용)
    implementation 'com.google.auth:google-auth-library-oauth2-http:1.22.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation 'com.google.guava:guava:31.1-android'

    // Dropbox Core SDK
    implementation 'com.dropbox.core:dropbox-core-sdk:5.4.5'
}

