plugins {
    id 'com.android.application'
}

android {
    namespace = 'cloud.einknote.note'
    compileSdk = 34

    defaultConfig {
        applicationId = "cloud.einknote.note"
        minSdk = 28  // 안드로이드9
        targetSdk = 34
        versionCode = 13  // 디렉토리 수정
        versionName = "2.2"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    // ---------------- [여기 블록 추가] ----------------
    lint {
        checkReleaseBuilds false    // 릴리즈 빌드 시 린트 검사로 인한 빌드 중단 방지
        abortOnError false          // 사소한 린트 경고가 있어도 빌드 강제 속행
    }
    // --------------------------------------------------

    buildFeatures {
        viewBinding = true
        dataBinding = false
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    packaging {
        resources {
            excludes += [
                    'META-INF/DEPENDENCIES',
                    'META-INF/LICENSE',
                    'META-INF/LICENSE.txt',
                    'META-INF/license.txt',
                    'META-INF/NOTICE',
                    'META-INF/NOTICE.txt',
                    'META-INF/notice.txt',
                    'META-INF/ASL2.0',
                    'META-INF/*.kotlin_module'
            ]
            pickFirsts += [
                    'META-INF/INDEX.LIST',
                    'META-INF/io.netty.versions.properties'
            ]
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Google Sign-In & Docs API
    implementation 'com.google.android.gms:play-services-auth:21.0.0'
    implementation('com.google.api-client:google-api-client-android:1.35.2') {
        exclude group: 'org.apache.httpcomponents'
        exclude group: 'com.google.guava', module: 'listenablefuture'
    }
    implementation('com.google.http-client:google-http-client-gson:1.43.3') {
        exclude group: 'org.apache.httpcomponents'
    }
    implementation('com.google.apis:google-api-services-docs:v1-rev20220609-1.32.1') {
        exclude group: 'org.apache.httpcomponents'
        exclude group: 'com.google.guava', module: 'listenablefuture'
    }

    // 최신 안정화 Drive v3 버전으로 교체
    implementation('com.google.apis:google-api-services-drive:v3-rev20230822-2.0.0') {
        exclude group: 'org.apache.httpcomponents'
        exclude group: 'com.google.guava', module: 'listenablefuture'
    }
    // 단위 테스트용 JUnit
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation 'com.google.guava:guava:31.1-android'

    // Dropbox Core SDK
    implementation 'com.dropbox.core:dropbox-core-sdk:5.4.5'
}